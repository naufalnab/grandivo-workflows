version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.5

    ports:
      - target: 5678
        published: 5678
        protocol: tcp
        mode: ingress

    environment:
      # Timezone
      TZ: Asia/Jakarta
      GENERIC_TIMEZONE: Asia/Jakarta

      # URL publik n8n
      N8N_HOST: n8n.grandivo.cloud
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.grandivo.cloud/
      N8N_WEBHOOK_URL: https://n8n.grandivo.cloud/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"

      # Pertahankan permission file n8n
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # Olsera
      OLSERA_APP_ID: "${OLSERA_APP_ID}"
      OLSERA_SECRET_KEY: "${OLSERA_SECRET_KEY}"

      # xAI / Grok Imagine (video terima kasih harian)
      XAI_API_KEY: "${XAI_API_KEY}"

      # Izinkan workflow membaca environment variable
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      # Pembersihan execution lama
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"

    volumes:
      # Volume lama n8n
      - n8n_data:/home/node/.n8n

    networks:
      # Reverse proxy Traefik/EasyPanel
      - easypanel

      # Akses ke PostgreSQL bisnis Grandivo
      - grandivo_backend

    stop_grace_period: 30s

    deploy:
      replicas: 1

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s

      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first

      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1G

      labels:
        - "traefik.enable=true"

        # Router HTTPS
        - "traefik.http.routers.grandivo-n8n.rule=Host(`n8n.grandivo.cloud`)"
        - "traefik.http.routers.grandivo-n8n.entrypoints=https"
        - "traefik.http.routers.grandivo-n8n.tls=true"
        - "traefik.http.routers.grandivo-n8n.tls.certresolver=letsencrypt"
        - "traefik.http.routers.grandivo-n8n.service=grandivo-n8n"

        # n8n menerima HTTP internal pada port 5678
        - "traefik.http.services.grandivo-n8n.loadbalancer.server.port=5678"
        - "traefik.http.services.grandivo-n8n.loadbalancer.server.scheme=http"

        # Network yang digunakan Traefik
        - "traefik.swarm.network=easypanel"

networks:
  easypanel:
    external: true
    name: easypanel

  grandivo_backend:
    external: true
    name: grandivo_backend

volumes:
  n8n_data:
    external: true
    name: n8n_n8n_data
