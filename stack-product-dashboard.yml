version: "3.8"

services:
  dashboard:
    image: ${DASHBOARD_NGINX_IMAGE:-nginx:1.29-alpine}

    configs:
      - source: dashboard_index
        target: /usr/share/nginx/html/index.html
        mode: 0444
      - source: dashboard_nginx_v2
        target: /etc/nginx/conf.d/default.conf
        mode: 0444

    ports:
      - target: 8080
        published: 8085
        protocol: tcp
        mode: ingress

    networks:
      - easypanel
      - dashboard_internal

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grandivo-dashboard.rule=Host(`dbo.grandivo.cloud`)"
        - "traefik.http.routers.grandivo-dashboard.entrypoints=https"
        - "traefik.http.routers.grandivo-dashboard.tls=true"
        - "traefik.http.routers.grandivo-dashboard.tls.certresolver=letsencrypt"
        - "traefik.http.routers.grandivo-dashboard.service=grandivo-dashboard"
        - "traefik.http.services.grandivo-dashboard.loadbalancer.server.port=8080"
        - "traefik.http.services.grandivo-dashboard.loadbalancer.server.scheme=http"
        - "traefik.swarm.network=easypanel"

  api:
    image: ${POSTGREST_IMAGE:-postgrest/postgrest:v14.3}

    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: grandivo_viewer
      PGRST_DB_MAX_ROWS: "2000"
      PGRST_OPENAPI_MODE: disabled
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: warn

    networks:
      - dashboard_internal
      - grandivo_backend

    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      resources:
        reservations:
          memory: 32M
        limits:
          memory: 128M

networks:
  easypanel:
    external: true
    name: easypanel

  grandivo_backend:
    external: true
    name: grandivo_backend

  dashboard_internal:
    driver: overlay
    internal: true

configs:
  dashboard_index:
    file: ./dashboard/index.html
  dashboard_nginx_v2:
    file: ./dashboard/nginx.conf
